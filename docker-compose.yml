services:
  piano-api:
    build: .
    image: piano-render-api:1.0.0
    container_name: piano-render-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
